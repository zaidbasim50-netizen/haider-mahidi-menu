<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم وقصابة حيدر مهيدي - اطلب الآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.17 0.015 55);--bg-2:oklch(0.22 0.025 55);--bg-3:oklch(0.26 0.03 55);
  --ink:oklch(0.95 0.02 85);--dim:oklch(0.74 0.03 80);
  --gold:oklch(0.80 0.13 85);--ember:oklch(0.66 0.18 45);
  --line:oklch(0.80 0.13 85 / .26);
  --out:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;padding:36px 0 24px;border-bottom:1px solid var(--line)}
.eyebrow{font:700 15px 'Tajawal',sans-serif;color:var(--ember);margin-bottom:8px}
h1{font-weight:900;font-size:clamp(30px,8vw,52px);line-height:1.15;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{font:500 15px 'Tajawal',sans-serif;color:var(--dim);margin-top:8px}
nav{position:sticky;top:0;z-index:5;background:oklch(0.17 0.015 55 / .92);backdrop-filter:blur(8px);padding:12px 0 10px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:-1px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;font:700 15px 'Tajawal',sans-serif;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;transition:transform .16s var(--out),color .2s,border-color .2s}
nav a:active{transform:scale(.96)}
nav a:hover{color:var(--gold);border-color:var(--gold)}
section{padding-top:22px;scroll-margin-top:64px}
h2{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:22px;color:var(--gold);padding-bottom:8px;border-bottom:1px solid var(--line)}
h2 small{font:500 13px 'Tajawal',sans-serif;color:var(--dim)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dotted oklch(0.95 0.02 85 / .16)}
.info{flex:1;min-width:0}
.name{font:700 17px 'Tajawal',sans-serif;line-height:1.4}
.price{font-weight:800;color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
.price small{font-size:11px;color:var(--dim);margin-inline-start:3px}
.tag{font:800 11px 'Cairo',sans-serif;background:var(--ember);color:oklch(0.15 0.02 50);padding:1px 8px;border-radius:999px;margin-inline-end:6px;vertical-align:2px}
button{font-family:inherit;cursor:pointer;color:inherit}
.add{flex:none;font:800 14px 'Cairo',sans-serif;color:var(--gold);background:none;border:1px solid var(--gold);border-radius:999px;padding:7px 20px;transition:transform .16s var(--out),background-color .2s}
.add:active{transform:scale(.95)}
.step{flex:none;display:flex;align-items:center;gap:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px}
.step button{width:38px;height:38px;border:0;background:none;font-size:20px;font-weight:800;color:var(--gold);border-radius:50%;transition:transform .16s var(--out)}
.step button:active{transform:scale(.88)}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
/* cart bar */
.bar{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:728px;margin:0 auto;z-index:10;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--ember);color:oklch(0.15 0.02 50);border:0;border-radius:16px;padding:14px 20px;font-weight:900;font-size:17px;
  box-shadow:0 10px 30px oklch(0 0 0 / .4);
  transform:translateY(140%);transition:transform .35s var(--out),scale .16s var(--out)}
.bar.on{transform:none}
.bar:active{scale:.98}
.bar span:last-child{font-variant-numeric:tabular-nums}
/* sheet */
.veil{position:fixed;inset:0;background:oklch(0 0 0 / .6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:92dvh;overflow-y:auto;z-index:21;background:var(--bg-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s var(--out)}
.sheet.on{transform:none}
.sheet>div{max-width:560px;margin:0 auto}
.sheet h3{font-weight:900;font-size:22px;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:26px;color:var(--dim);width:40px;height:40px}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font:700 16px 'Tajawal',sans-serif;border-bottom:1px dotted oklch(0.95 0.02 85 / .16)}
.line span:last-child{color:var(--gold);white-space:nowrap;font-family:'Cairo';font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:19px;padding:14px 0 4px}
.note{font:500 13px 'Tajawal',sans-serif;color:var(--dim);margin-bottom:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin:14px 0}
.seg button{border:0;background:none;font:700 15px 'Tajawal',sans-serif;color:var(--dim);padding:10px 4px;border-radius:9px;transition:background-color .2s,color .2s,transform .16s var(--out)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--bg-3);color:var(--gold)}
label{display:block;font:700 14px 'Tajawal',sans-serif;color:var(--dim);margin:12px 0 6px}
input,textarea{width:100%;font:600 16px 'Cairo',sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;height:76px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none}
.err{color:oklch(0.75 0.15 25);font:700 14px 'Tajawal',sans-serif;min-height:20px;margin-top:10px}
.send{width:100%;margin-top:6px;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:18px;background:oklch(0.72 0.19 150);color:oklch(0.16 0.04 150);transition:transform .16s var(--out)}
.send:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">يوجد مكان خاص للعوائل • توصيل جملة ومفرد</div>
    <h1>مطعم وقصابة <span>حيدر مهيدي</span></h1>
    <p class="sub">اختر طلبك وأرسله مباشرة عبر واتساب</p>
  </header>
  <nav id="nav"></nav>
  <div id="menu"></div>
</div>

<button class="bar" id="bar"><span id="bc"></span><span>عرض الطلب</span><span id="bt"></span></button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div>
  <h3><span>طلبك</span><button class="x" id="close" aria-label="إغلاق">×</button></h3>
  <div id="lines"></div>
  <div class="total"><span>المجموع</span><span id="tot"></span></div>
  <p class="note">المجموع لا يشمل أجور التوصيل.</p>

  <div class="seg" id="seg">
    <button data-t="reserve" class="on">حجز طاولة</button>
    <button data-t="delivery">توصيل</button>
    <button data-t="pickup">استلام</button>
  </div>
  <label for="nm">الاسم</label><input id="nm" autocomplete="name">
  <label for="ph">رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right">
  <div id="f-reserve" class="two">
    <div><label for="tm">وقت الحضور</label><input id="tm" type="time"></div>
    <div><label for="gs">عدد الأشخاص</label><input id="gs" type="number" min="1" inputmode="numeric"></div>
  </div>
  <div id="f-delivery" class="hide"><label for="ad">العنوان</label><input id="ad"></div>
  <div id="f-pickup" class="hide"><label for="pt">وقت الاستلام</label><input id="pt" type="time"></div>
  <label for="nt">ملاحظات (اختياري)</label><textarea id="nt"></textarea>
  <div class="err" id="err"></div>
  <button class="send" id="send">إرسال الطلب عبر واتساب</button>
</div></div>

<script>
const WA="9647829787357";
const S=[
{t:"المشويات بالوزن",s:"كباب ولحوم طازجة",i:[
["كيلو كباب لحم",20000],["كيلو كباب دجاج",20000],["كيلو كباب مشكل",20000],["كيلو من ضمنه 2 دجاج",20000],
["ثلاث أرباع كباب وزن / مشكل بالدجاج",15000],["شيش وزن (11 شيش)",11000],["نص كيلو كباب (لحم / دجاج / مشكل)",10000],
["شياش عدد 10 (أو ضمنه شيشين/دجاج)",10000],["ربع كيلو كباب (لحم أو دجاج)",5000]]},
{t:"الدجاج والتمن والمرك",s:"طبخ وشوي يومي",i:[
["دجاجة على التمن",17000],["دجاجة على التمن",14000,1],["دجاجة ناشفة",12000],["نص دجاج على التمن",8000],
["نص دجاجة شوي",6000],["ربع دجاج على التمن",6000],["صينية تمن ومرك",5000],["نفر تمن ومرك",3000],
["ربع دجاج (بدون تمن)",3000],["ماعون تمن / ماعون مرك",1500]]},
{t:"النفرات والوجبات",s:"الطلبات الفردية",i:[
["نفر كباب لحم / نفر كباب دجاج",8000],["نفر معلاك / نفر قلب",8000],["نفر مشكل / نفر تكة دجاج",8000],
["نص نفر (كباب لحم / كباب دجاج)",4000],["نص نفر (معلاك / قلب / تكة لحم)",4000],["نص نفر (تكة دجاج / أجنحة)",4000],
["نص مشكل (كباب ومعلاك / كباب وتكة لحم)",4000],["نص مشكل (كباب ودجاج / كباب وتكة دجاج)",4000],
["نص مشكل بالقلب / كباب دجاج ومعلاك",4000]]},
{t:"الأشياش والمشروبات",s:"السحب السريع",i:[
["شيش كباب لحم (وزن)",1000],["شيش كباب دجاج (وزن)",1000],["شيش كباب (لحم أو دجاج)",2000],["شيش تكة لحم",2000],
["شيش تكة دجاج",2000],["شيش معلاك عراقي",2000],["شيش كلاوي",2000],["شيش أجنحة مشوية",2000],["شاي عراقي مهيل",250]]}
];
const $=id=>document.getElementById(id), f=n=>n.toLocaleString('en-US');
const cart={}, items=[]; let type="reserve";
S.forEach((x,si)=>x.i.forEach((it,k)=>{it.id=items.length;items.push({n:it[0],p:it[1]})}));
$('nav').innerHTML=S.map((x,i)=>`<a href="#s${i}">${x.t}</a>`).join('');
$('menu').innerHTML=S.map((x,si)=>`<section id="s${si}"><h2><span>${x.t}</span><small>${x.s}</small></h2>${
x.i.map(it=>`<div class="row"><div class="info"><div class="name">${it[2]?'<span class="tag">عرض خاص</span>':''}${it[0]}</div><div class="price">${f(it[1])}<small>د.ع</small></div></div><div data-c="${it.id}"></div></div>`).join('')}</section>`).join('');

function ctl(id){
  const q=cart[id]||0, el=document.querySelector(`[data-c="${id}"]`);
  el.innerHTML=q?`<div class="step"><button data-a="+" data-id="${id}" aria-label="زيادة">+</button><b>${q}</b><button data-a="-" data-id="${id}" aria-label="نقصان">−</button></div>`
    :`<button class="add" data-a="+" data-id="${id}">أضف</button>`;
}
items.forEach((_,i)=>ctl(i));
function sums(){let c=0,t=0;for(const id in cart){c+=cart[id];t+=cart[id]*items[id].p}return{c,t}}
function refresh(){
  const {c,t}=sums();
  $('bar').classList.toggle('on',c>0);
  $('bc').textContent=c+(c==1?' صنف':' أصناف'); $('bt').textContent=f(t)+' د.ع';
  $('tot').textContent=f(t)+' د.ع';
  $('lines').innerHTML=Object.keys(cart).map(id=>`<div class="line"><span>${cart[id]} × ${items[id].n}</span><span>${f(cart[id]*items[id].p)}</span></div>`).join('');
  if(!c) close();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const id=b.dataset.id; cart[id]=(cart[id]||0)+(b.dataset.a=='+'?1:-1);
  if(cart[id]<=0) delete cart[id];
  ctl(id); refresh();
});
const open=()=>{$('sheet').classList.add('on');$('veil').classList.add('on')};
function close(){$('sheet').classList.remove('on');$('veil').classList.remove('on')}
$('bar').onclick=open; $('close').onclick=close; $('veil').onclick=close;
$('seg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return; type=b.dataset.t;
  [...$('seg').children].forEach(x=>x.classList.toggle('on',x==b));
  ['reserve','delivery','pickup'].forEach(k=>$('f-'+k).classList.toggle('hide',k!=type));
};
$('send').onclick=()=>{
  const nm=$('nm').value.trim(), ph=$('ph').value.trim(), ad=$('ad').value.trim();
  const err=m=>{$('err').textContent=m};
  if(!nm) return err('اكتب اسمك');
  if(ph.replace(/\D/g,'').length<10) return err('اكتب رقم هاتف صحيح');
  if(type=='delivery'&&!ad) return err('اكتب عنوان التوصيل');
  if(type=='reserve'&&!$('gs').value) return err('اكتب عدد الأشخاص');
  err('');
  const {t}=sums();
  const L=['*طلب جديد - مطعم حيدر مهيدي*','',
    'الاسم: '+nm,'الهاتف: '+ph,
    'النوع: '+({reserve:'حجز طاولة',delivery:'توصيل',pickup:'استلام'})[type]];
  if(type=='reserve') L.push('وقت الحضور: '+($('tm').value||'غير محدد'),'عدد الأشخاص: '+$('gs').value);
  if(type=='delivery') L.push('العنوان: '+ad);
  if(type=='pickup') L.push('وقت الاستلام: '+($('pt').value||'غير محدد'));
  L.push('','*الطلبات:*');
  for(const id in cart) L.push(`- ${cart[id]} × ${items[id].n} = ${f(cart[id]*items[id].p)}`);
  L.push('','*المجموع: '+f(t)+' د.ع*');
  if(type=='delivery') L.push('(لا يشمل أجور التوصيل)');
  if($('nt').value.trim()) L.push('','ملاحظات: '+$('nt').value.trim());
  const a=document.createElement('a');
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
  a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
