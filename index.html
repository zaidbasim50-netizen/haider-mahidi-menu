<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم وقصابة حيدر مهيدي - اطلب الآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.99 0.004 85);--card:#fff;--tint:oklch(0.96 0.035 80);
  --ink:oklch(0.25 0.03 50);--dim:oklch(0.52 0.03 60);
  --ember:oklch(0.60 0.19 45);--ember-d:oklch(0.52 0.19 45);
  --line:oklch(0.92 0.015 80);
  --out:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:820px;margin:0 auto}
header{text-align:center;padding:34px 0 18px}
.eyebrow{font:700 14px 'Tajawal',sans-serif;color:var(--ember);margin-bottom:6px}
h1{font-weight:900;font-size:clamp(28px,7vw,46px);line-height:1.15;text-wrap:balance}
h1 span{color:var(--ember)}
.sub{font:500 15px 'Tajawal',sans-serif;color:var(--dim);margin-top:6px}
.top{position:sticky;top:0;z-index:5;background:oklch(0.99 0.004 85 / .94);backdrop-filter:blur(10px);padding:10px 0 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.search{width:100%;font:600 16px 'Cairo',sans-serif;color:var(--ink);background:var(--tint);border:1px solid transparent;border-radius:14px;padding:12px 16px;outline:none;transition:border-color .2s,background-color .2s}
.search:focus{border-color:var(--ember);background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 14px 'Tajawal',sans-serif;color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:transform .16s var(--out),background-color .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
section{padding-top:24px;scroll-margin-top:110px}
h2{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:21px;margin-bottom:12px}
h2 small{font:500 13px 'Tajawal',sans-serif;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 1px 2px oklch(0.3 0.03 50 / .04);transition:transform .25s var(--out),box-shadow .25s,border-color .2s;opacity:0;animation:in .45s var(--out) forwards;animation-delay:calc(var(--i,0)*35ms)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px oklch(0.3 0.03 50 / .1)}}
.card.in-cart{border-color:var(--ember)}
.pic{position:relative;aspect-ratio:1/.82;background:var(--tint);display:grid;place-items:center;overflow:hidden}
.pic svg{width:74%;height:74%;transition:transform .4s var(--out)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(hover:hover){.card:hover .pic svg{transform:scale(1.07) rotate(-2deg)}}
.badge{position:absolute;top:8px;inset-inline-start:8px;font:800 11px 'Cairo';background:var(--ember);color:#fff;padding:2px 10px;border-radius:999px}
.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font:700 15px/1.45 'Tajawal',sans-serif;flex:1;min-height:2.9em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.price small{font:600 11px 'Tajawal';color:var(--dim);margin-inline-start:3px}
button{font-family:inherit;cursor:pointer;color:inherit}
.add{font:800 14px 'Cairo';color:#fff;background:var(--ember);border:0;border-radius:999px;padding:8px 18px;transition:transform .16s var(--out)}
.add:active{transform:scale(.94)}
.step{display:flex;align-items:center;background:var(--tint);border-radius:999px}
.step button{width:34px;height:34px;border:0;background:none;font-size:19px;font-weight:800;color:var(--ember-d);border-radius:50%;transition:transform .16s var(--out)}
.step button:active{transform:scale(.85)}
.step b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--dim);font:600 16px 'Tajawal';padding:48px 0;display:none}
.bar{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:788px;margin:0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 20px;font-weight:900;font-size:16px;box-shadow:0 12px 30px oklch(0.2 0.03 50 / .3);
  transform:translateY(150%);transition:transform .35s var(--out)}
.bar.on{transform:none}
.bar.bump{animation:bump .3s var(--out)}
@keyframes bump{40%{transform:scale(1.03)}}
.bar .ct{background:var(--ember);border-radius:999px;padding:1px 12px;font-variant-numeric:tabular-nums}
.bar span:last-child{font-variant-numeric:tabular-nums}
.veil{position:fixed;inset:0;background:oklch(0.2 0.03 50 / .45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:92dvh;overflow-y:auto;z-index:21;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px oklch(0.2 0.03 50 / .15);
  padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s var(--out)}
.sheet.on{transform:none}
.sheet>div{max-width:560px;margin:0 auto}
.sheet h3{font-weight:900;font-size:22px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:26px;color:var(--dim);width:40px;height:40px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font:700 16px 'Tajawal',sans-serif;border-bottom:1px solid var(--line)}
.line span:last-child{white-space:nowrap;font-family:'Cairo';font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:19px;padding:14px 0 4px}
.note{font:500 13px 'Tajawal',sans-serif;color:var(--dim);margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--tint);border-radius:12px;padding:4px;margin:12px 0}
.seg button{border:0;background:none;font:700 15px 'Tajawal',sans-serif;color:var(--dim);padding:10px 4px;border-radius:9px;transition:background-color .2s,color .2s,transform .16s var(--out)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:#fff;color:var(--ember-d);box-shadow:0 1px 4px oklch(0.3 0.03 50 / .1)}
label{display:block;font:700 14px 'Tajawal',sans-serif;color:var(--dim);margin:12px 0 6px}
input,textarea{width:100%;font:600 16px 'Cairo',sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--ember)}
textarea{resize:none;height:72px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none!important}
.err{color:oklch(0.55 0.2 25);font:700 14px 'Tajawal',sans-serif;min-height:20px;margin-top:10px}
.send{width:100%;margin-top:6px;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:18px;background:oklch(0.62 0.18 150);color:#fff;transition:transform .16s var(--out)}
.send:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">أول مطعم بمنيو إلكتروني في قضاء المناذرة • مكان خاص للعوائل</div>
    <h1>مطعم وقصابة <span>حيدر مهيدي</span></h1>
    <p class="sub">اختر طلبك وأرسله مباشرة عبر واتساب • توصيل جملة ومفرد</p>
  </header>
  <div class="top">
    <input class="search" id="q" type="search" placeholder="ابحث عن صنف... (كباب، تمن، شاي)" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div id="menu"></div>
  <div class="empty" id="empty">لا توجد نتائج مطابقة</div>
</div>

<button class="bar" id="bar"><span class="ct" id="bc"></span><span>عرض الطلب</span><span id="bt"></span></button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div>
  <h3><span>طلبك</span><button class="x" id="close" aria-label="إغلاق">×</button></h3>
  <div id="lines"></div>
  <div class="total"><span>المجموع</span><span id="tot"></span></div>
  <p class="note">المجموع لا يشمل أجور التوصيل.</p>
  <div class="seg" id="seg">
    <button data-t="reserve" class="on">حجز طاولة</button>
    <button data-t="delivery">توصيل</button>
    <button data-t="pickup">استلام</button>
  </div>
  <label for="nm">الاسم</label><input id="nm" autocomplete="name">
  <label for="ph">رقم الهاتف</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right">
  <div id="f-reserve" class="two">
    <div><label for="tm">وقت الحضور</label><input id="tm" type="time"></div>
    <div><label for="gs">عدد الأشخاص</label><input id="gs" type="number" min="1" inputmode="numeric"></div>
  </div>
  <div id="f-delivery" class="hide"><label for="ad">العنوان</label><input id="ad"></div>
  <div id="f-pickup" class="hide"><label for="pt">وقت الاستلام</label><input id="pt" type="time"></div>
  <label for="nt">ملاحظات (اختياري)</label><textarea id="nt"></textarea>
  <div class="err" id="err"></div>
  <button class="send" id="send">إرسال الطلب عبر واتساب</button>
</div></div>

function photoKey(n){
  if(n.includes('شاي'))return 'tea';
  if(n.includes('دجاجة'))return 'chk';
  if(n.includes('شيش')&&n.includes('أجنحة'))return;
  if(n.includes('تمن')||n.includes('مرك')||n.includes('دجاجة')||n.includes('نص دجاج')||n.includes('ربع دجاج'))return;
  if(n.includes('معلاك')||n.includes('قلب')||n.includes('كلاوي')||n.includes('مشكل')||n.includes('2 دجاج'))return 'mix';
  if(n.includes('تكة دجاج'))return 'tikkad';
  if(n.includes('تكة لحم'))return 'tikkal';
  if(n.includes('شيش')||n.includes('شياش'))return n.includes('دجاج')&&!n.includes('لحم')?'tikkad':'tikkal';
  if(n.includes('كباب دجاج')&&!n.includes('لحم'))return 'kdaj';
  return 'kebab';
}

tea:'<ellipse cx="50" cy="82" rx="30" ry="7" fill="#efe6d8"/><path d="M32 34h36l-4.5 42a4 4 0 0 1-4 3.6H40.5a4 4 0 0 1-4-3.6z" fill="#c8601e" opacity=".92"/><path d="M32 34h36l-1.6 14H33.6z" fill="#fff" opacity=".4"/><path d="M32 34h36" stroke="#9a9a9a" stroke-width="1.6"/><path d="M44 25c-4-5 4-8 0-13M56 25c-4-5 4-8 0-13" stroke="#cbbfae" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
};
function art(n,id){
  const p=PHOTOS[id]||IMG[photoKey(n)];const u=p?`<img src="${p}" alt="" loading="lazy" onerror="this.remove()">`:'';
  let k='kebab',s=null;
  if(n.includes('شاي'))k='tea';
  else if(n.includes('شيش')&&n.includes('أجنحة'))k='wing';
  else if(n.includes('تمن')||n.includes('مرك'))k='rice';
  else if(n.includes('دجاجة ناشفة'))k='chk';
  else if(n.includes('نص دجاجة')||n.includes('ربع دجاج'))k='half';
  else if(n.includes('كلاوي'))s='#5a2a22';
  else if(n.includes('شيش')&&n.includes('معلاك'))s='#7a3a2a';
  else if(n.includes('شيش')&&n.includes('دجاج'))s='#e0a845';
  else if(n.includes('شيش')||n.includes('شياش'))s='#b8683c';
  else if(n.includes('مشكل')||n.includes('2 دجاج'))k='mix';
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${s?plate+skew(s):A[k]}</svg>`+u;
}
const $=id=>document.getElementById(id),f=n=>n.toLocaleString('en-US');
const cart={},items=[];let type='reserve',cat='all',term='';
S.forEach(x=>x.i.forEach(it=>{it.id=items.length;items.push({n:it[0],p:it[1]})}));
$('chips').innerHTML=['الكل',...S.map(x=>x.t)].map((t,i)=>`<button class="chip${i?'':' on'}" data-cat="${i-1}">${t}</button>`).join('');
$('menu').innerHTML=S.map((x,si)=>`<section data-s="${si}"><h2><span>${x.t}</span><small>${x.s}</small></h2><div class="grid">${
x.i.map(it=>`<article class="card" data-n="${it[0]}" style="--i:${it.id%12}"><div class="pic">${art(it[0],it.id)}${it[2]?'<span class="badge">عرض خاص</span>':''}</div><div class="body"><div class="name">${it[0]}</div><div class="row"><div class="price">${f(it[1])}<small>د.ع</small></div><div data-c="${it.id}"></div></div></div></article>`).join('')}</div></section>`).join('');
function ctl(id){
  const q=cart[id]||0,el=document.querySelector(`[data-c="${id}"]`);
  el.closest('.card').classList.toggle('in-cart',q>0);
  el.innerHTML=q?`<div class="step"><button data-a="+" data-id="${id}" aria-label="زيادة">+</button><b>${q}</b><button data-a="-" data-id="${id}" aria-label="نقصان">−</button></div>`
   :`<button class="add" data-a="+" data-id="${id}">أضف</button>`;
}
items.forEach((_,i)=>ctl(i));
function sums(){let c=0,t=0;for(const id in cart){c+=cart[id];t+=cart[id]*items[id].p}return{c,t}}
function refresh(){
  const{c,t}=sums();
  $('bar').classList.toggle('on',c>0);
  $('bc').textContent=c;$('bt').textContent=f(t)+' د.ع';$('tot').textContent=f(t)+' د.ع';
  $('lines').innerHTML=Object.keys(cart).map(id=>`<div class="line"><span>${cart[id]} × ${items[id].n}</span><span>${f(cart[id]*items[id].p)}</span></div>`).join('');
  if(!c)close();
}
function filter(){
  let any=false;
  document.querySelectorAll('section').forEach(sec=>{
    let n=0;
    sec.querySelectorAll('.card').forEach(c=>{
      const ok=c.dataset.n.includes(term)&&(cat==='all'||sec.dataset.s===cat);
      c.classList.toggle('hide',!ok);if(ok)n++;
    });
    sec.classList.toggle('hide',!n);if(n)any=true;
  });
  $('empty').style.display=any?'none':'block';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){
    const id=b.dataset.id;cart[id]=(cart[id]||0)+(b.dataset.a=='+'?1:-1);
    if(cart[id]<=0)delete cart[id];
    ctl(id);refresh();
    if(b.dataset.a=='+'){const bar=$('bar');bar.classList.remove('bump');void bar.offsetWidth;bar.classList.add('bump');if(navigator.vibrate)navigator.vibrate(8)}
    return;
  }
  const ch=e.target.closest('.chip');
  if(ch){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==ch));cat=ch.dataset.cat==='-1'?'all':ch.dataset.cat;filter();scrollTo({top:0,behavior:'smooth'})}
});
$('q').oninput=e=>{term=e.target.value.trim();filter()};
const open=()=>{$('sheet').classList.add('on');$('veil').classList.add('on')};
function close(){$('sheet').classList.remove('on');$('veil').classList.remove('on')}
$('bar').onclick=open;$('close').onclick=close;$('veil').onclick=close;
$('seg').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;type=b.dataset.t;
  [...$('seg').children].forEach(x=>x.classList.toggle('on',x==b));
  ['reserve','delivery','pickup'].forEach(k=>$('f-'+k).classList.toggle('hide',k!=type));
};
$('send').onclick=()=>{
  const nm=$('nm').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim(),err=m=>{$('err').textContent=m};
  if(!nm)return err('اكتب اسمك');
  if(ph.replace(/\D/g,'').length<10)return err('اكتب رقم هاتف صحيح');
  if(type=='delivery'&&!ad)return err('اكتب عنوان التوصيل');
  if(type=='reserve'&&!$('gs').value)return err('اكتب عدد الأشخاص');
  err('');const{t}=sums();
  const L=['*طلب جديد - مطعم حيدر مهيدي*','','الاسم: '+nm,'الهاتف: '+ph,'النوع: '+({reserve:'حجز طاولة',delivery:'توصيل',pickup:'استلام'})[type]];
  if(type=='reserve')L.push('وقت الحضور: '+($('tm').value||'غير محدد'),'عدد الأشخاص: '+$('gs').value);
  if(type=='delivery')L.push('العنوان: '+ad);
  if(type=='pickup')L.push('وقت الاستلام: '+($('pt').value||'غير محدد'));
  L.push('','*الطلبات:*');
  for(const id in cart)L.push(`- ${cart[id]} × ${items[id].n} = ${f(cart[id]*items[id].p)}`);
  L.push('','*المجموع: '+f(t)+' د.ع*');
  if(type=='delivery')L.push('(لا يشمل أجور التوصيل)');
  if($('nt').value.trim())L.push('','ملاحظات: '+$('nt').value.trim());
  const a=document.createElement('a');
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
  a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
};
</script>
